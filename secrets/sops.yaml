# sops/agenix routing — maps encrypted blobs to authorized recipient public keys.
# Placeholder only; sops-nix is not wired into the flake yet.
# Replace the key with your age public key, then encrypt secrets for this identity.
keys:
  age:
    - &kei-nixos <age-public-key-here>

creation_rules:
  - path_regex: secrets/.*\.yaml$
    encrypted_regex: "^(data|password|token)$"
    age: *kei-nixos
