# sops/agenix routing — maps encrypted blobs to authorized recipient public keys.
# The sops-nix input is wired (home/kei/modules/sops.nix) but no secret is
# declared in Nix yet. Replace the key, then encrypt: sops secrets/hermes.yaml
keys:
  age:
    - &kei-nixos <age-public-key-here>

creation_rules:
  # No encrypted_regex: every value in this file IS a secret. A key list here
  # leaves any value outside it in PLAINTEXT in git.
  - path_regex: secrets/.*\.yaml$
    age: *kei-nixos
